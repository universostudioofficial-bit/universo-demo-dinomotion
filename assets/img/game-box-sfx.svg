<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="100%" height="100%" fill="none">
  <!-- 3D Big Box PC Game: DINO SFX PACK -->
  <defs>
    <filter id="box-shadow-sfx" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="14" stdDeviation="0" flood-color="#111111" flood-opacity="1" />
    </filter>
  </defs>

  <g filter="url(#box-shadow-sfx)">
    <!-- Spine (Left side in perspective) -->
    <polygon points="45,80 100,50 100,310 45,340" fill="#047857" stroke="#111111" stroke-width="5" stroke-linejoin="round" />
    <text x="-210" y="78" transform="rotate(-90)" font-family="'Gasoek One', Impact, sans-serif" font-size="20" fill="#ffffff" letter-spacing="3">DINO SFX PACK 150+</text>

    <!-- Front Cover (Isometric right) -->
    <polygon points="100,50 285,75 285,335 100,310" fill="#10b981" stroke="#111111" stroke-width="5" stroke-linejoin="round" />

    <!-- Top Flap (Perspective top) -->
    <polygon points="45,80 100,50 285,75 230,105" fill="#34d399" stroke="#111111" stroke-width="5" stroke-linejoin="round" />

    <!-- Cover Art Details -->
    <!-- Badge Gold Hologram -->
    <circle cx="240" cy="120" r="28" fill="#facc15" stroke="#111111" stroke-width="4" />
    <text x="240" y="117" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10" fill="#111111" text-anchor="middle">STEAM</text>
    <text x="240" y="129" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#111111" text-anchor="middle">READY</text>

    <!-- Main Title Art on Box -->
    <rect x="115" y="150" width="155" height="48" rx="8" fill="#111111" />
    <text x="192" y="182" font-family="'Gasoek One', Impact, sans-serif" font-size="22" fill="#facc15" text-anchor="middle" letter-spacing="1">DINO SFX</text>

    <!-- Subtitle Banner -->
    <rect x="120" y="206" width="145" height="24" rx="6" fill="#fef08a" stroke="#111111" stroke-width="3" />
    <text x="192" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#111111" text-anchor="middle">150+ AUDIO HITS &amp; IMPACTS</text>

    <!-- Waveform &amp; Speaker Graphic -->
    <path d="M 130 270 L 140 255 L 150 280 L 160 245 L 170 285 L 180 250 L 190 280 L 205 260 L 215 270 L 255 270" 
          stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>

