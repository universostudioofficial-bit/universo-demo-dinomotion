<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" width="100%" height="100%" fill="none">
  <!-- POLAROID CHARISMATIC AVATAR - LUCAS DINO (NEO-BRUTALIST GAMER CRAFT) -->
  <defs>
    <filter id="polaroid-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="8" dy="12" stdDeviation="0" flood-color="#111111" flood-opacity="1" />
    </filter>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#111111" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Washi Tape Amarela no Topo com textura e bordas rasgadas -->
  <g transform="rotate(-3 170 20)">
    <rect x="95" y="6" width="150" height="28" fill="#facc15" stroke="#111111" stroke-width="3" opacity="0.95" />
    <!-- Hachuras de fita crepe -->
    <line x1="110" y1="10" x2="110" y2="30" stroke="#ca8a04" stroke-width="2" opacity="0.5" />
    <line x1="130" y1="10" x2="130" y2="30" stroke="#ca8a04" stroke-width="2" opacity="0.5" />
    <line x1="150" y1="10" x2="150" y2="30" stroke="#ca8a04" stroke-width="2" opacity="0.5" />
    <line x1="170" y1="10" x2="170" y2="30" stroke="#ca8a04" stroke-width="2" opacity="0.5" />
    <line x1="190" y1="10" x2="190" y2="30" stroke="#ca8a04" stroke-width="2" opacity="0.5" />
    <line x1="210" y1="10" x2="210" y2="30" stroke="#ca8a04" stroke-width="2" opacity="0.5" />
    <line x1="230" y1="10" x2="230" y2="30" stroke="#ca8a04" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Corpo Principal da Polaroid -->
  <g filter="url(#polaroid-shadow)" transform="rotate(1.5 170 200)">
    <!-- Moldura de Papel Fotográfico Branco -->
    <rect x="25" y="32" width="290" height="345" rx="14" fill="#ffffff" stroke="#111111" stroke-width="5" />

    <!-- Canvas da Foto (Estúdio Gamer Escuro com Rim Light Verde Esmeralda) -->
    <rect x="42" y="50" width="256" height="230" rx="8" fill="#0f172a" stroke="#111111" stroke-width="4" />

    <!-- Iluminação Neon de Fundo (Aura Gamer circular) -->
    <circle cx="170" cy="155" r="85" fill="#10b981" opacity="0.25" />
    <circle cx="170" cy="155" r="55" fill="#06b6d4" opacity="0.3" />

    <!-- Grade Cyberpunk sutil ao fundo -->
    <line x1="42" y1="180" x2="298" y2="180" stroke="#1e293b" stroke-width="2" opacity="0.6" />
    <line x1="42" y1="215" x2="298" y2="215" stroke="#1e293b" stroke-width="2" opacity="0.6" />
    <line x1="110" y1="50" x2="110" y2="280" stroke="#1e293b" stroke-width="2" opacity="0.4" />
    <line x1="230" y1="50" x2="230" y2="280" stroke="#1e293b" stroke-width="2" opacity="0.4" />

    <!-- ILUSTRAÇÃO AUTORAL DE LUCAS DINO -->
    <!-- Ombros e Jaqueta Streetwear Gamer -->
    <path d="M 80 280 C 85 225 125 210 170 210 C 215 210 255 225 260 280 Z" fill="#1e293b" stroke="#111111" stroke-width="4.5" />
    
    <!-- Detalhes da Jaqueta: Capuz Amarelo por baixo e Zíper -->
    <!-- Capuz Amarelo Interno -->
    <path d="M 130 212 C 145 228 155 234 170 234 C 185 234 195 228 210 212 Z" fill="#facc15" stroke="#111111" stroke-width="3.5" />
    <!-- Camiseta Preta interna em V -->
    <polygon points="170,248 152,228 188,228" fill="#0f172a" stroke="#111111" stroke-width="3" />
    <!-- Linha do Zíper e Costuras -->
    <line x1="170" y1="234" x2="170" y2="280" stroke="#111111" stroke-width="4" stroke-dasharray="4 2" />
    <line x1="140" y1="228" x2="135" y2="280" stroke="#334155" stroke-width="3" />
    <line x1="200" y1="228" x2="205" y2="280" stroke="#334155" stroke-width="3" />

    <!-- Pescoço -->
    <rect x="155" y="180" width="30" height="36" fill="#fbcfe8" stroke="#111111" stroke-width="4" />
    <!-- Sombra sob o Queixo -->
    <path d="M 155 188 C 162 196 178 196 185 188 Z" fill="#e2b4be" opacity="0.7" />

    <!-- CABEÇA & ROSTO ESTILIZADO -->
    <!-- Contorno de Mandíbula e Queixo Moderno -->
    <path d="M 132 145 C 130 185 145 204 170 204 C 195 204 210 185 208 145 C 208 118 195 106 170 106 C 145 106 132 118 132 145 Z" fill="#fed7aa" stroke="#111111" stroke-width="4.5" />

    <!-- Barba & Cavanhaque Estiloso (Designer Stubble) -->
    <path d="M 144 172 C 148 198 192 198 196 172 C 188 182 178 185 170 185 C 162 185 152 182 144 172 Z" fill="#451a03" stroke="#111111" stroke-width="3" />
    <!-- Bigode sutil -->
    <path d="M 158 174 Q 170 178 182 174" stroke="#451a03" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Boca / Sorriso Carismático -->
    <path d="M 160 179 Q 170 185 180 179" stroke="#111111" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Nariz Expressivo -->
    <path d="M 168 152 L 173 164 L 166 166" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- OLHOS & ÓCULOS MODERNOS -->
    <!-- Olhos expressivos e vivos sob as lentes -->
    <ellipse cx="152" cy="148" rx="8" ry="9" fill="#ffffff" />
    <circle cx="153" cy="148" r="5" fill="#111111" />
    <circle cx="151" cy="146" r="1.8" fill="#ffffff" />

    <ellipse cx="188" cy="148" rx="8" ry="9" fill="#ffffff" />
    <circle cx="187" cy="148" r="5" fill="#111111" />
    <circle cx="185" cy="146" r="1.8" fill="#ffffff" />

    <!-- Armação dos Óculos (Preto Fosco Neo-Brutalista) -->
    <!-- Lente Esquerda -->
    <rect x="140" y="136" width="26" height="24" rx="7" fill="none" stroke="#111111" stroke-width="3.8" />
    <!-- Reflexo de luz na lente -->
    <path d="M 143 140 L 153 140" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
    <!-- Lente Direita -->
    <rect x="174" y="136" width="26" height="24" rx="7" fill="none" stroke="#111111" stroke-width="3.8" />
    <!-- Reflexo de luz na lente -->
    <path d="M 177 140 L 187 140" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
    <!-- Ponteira dos óculos -->
    <path d="M 166 145 Q 170 142 174 145" stroke="#111111" stroke-width="3.5" fill="none" />

    <!-- Sobrancelhas Confiantes -->
    <path d="M 140 131 Q 153 128 164 133" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 176 133 Q 187 128 200 131" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Orelhas -->
    <ellipse cx="129" cy="155" rx="6" ry="10" fill="#fed7aa" stroke="#111111" stroke-width="3" />
    <ellipse cx="211" cy="155" rx="6" ry="10" fill="#fed7aa" stroke="#111111" stroke-width="3" />

    <!-- BONÉ VIRADO PARA TRÁS (VERDE DINO + LOGO DINO) -->
    <!-- Aba virada para a nuca -->
    <path d="M 124 135 C 110 148 118 160 128 152 Z" fill="#047857" stroke="#111111" stroke-width="3.5" />
    <!-- Copa do Boné -->
    <path d="M 129 135 C 126 92 152 80 170 80 C 188 80 214 92 211 135 Z" fill="#10b981" stroke="#111111" stroke-width="4.5" />
    <!-- Faixa de Ajuste do Boné (Snapback) -->
    <rect x="134" y="118" width="72" height="15" rx="6" fill="#065f46" stroke="#111111" stroke-width="3.5" />
    <circle cx="150" cy="125" r="2.5" fill="#facc15" />
    <circle cx="160" cy="125" r="2.5" fill="#facc15" />
    <circle cx="170" cy="125" r="2.5" fill="#facc15" />
    <circle cx="180" cy="125" r="2.5" fill="#facc15" />
    <circle cx="190" cy="125" r="2.5" fill="#facc15" />

    <!-- HEADSET STREAMER PRO (ROXO + NEON CIANO) -->
    <!-- Arco do Headset por cima -->
    <path d="M 120 145 C 115 62 225 62 220 145" fill="none" stroke="#7c3aed" stroke-width="16" stroke-linecap="round" />
    <path d="M 120 145 C 115 62 225 62 220 145" fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 145 74 Q 170 66 195 74" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Concha Auricular Esquerda -->
    <rect x="110" y="132" width="20" height="38" rx="10" fill="#ff5436" stroke="#111111" stroke-width="3.5" />
    <rect x="114" y="138" width="12" height="26" rx="6" fill="#7c3aed" />

    <!-- Concha Auricular Direita -->
    <rect x="210" y="132" width="20" height="38" rx="10" fill="#ff5436" stroke="#111111" stroke-width="3.5" />
    <rect x="214" y="138" width="12" height="26" rx="6" fill="#7c3aed" />
    <!-- Anel de LED Neon no Headset -->
    <circle cx="220" cy="151" r="5" fill="#00ffcc" />

    <!-- Microfone Articulado de Estúdio -->
    <path d="M 220 162 Q 230 190 205 198" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round" />
    <rect x="194" y="193" width="14" height="10" rx="4" fill="#111111" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="199" cy="198" r="2" fill="#ef4444" />

    <!-- TEXTOS LIMPOS NA MOLDURA INFERIOR -->
    <text x="170" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="1px">LUCAS "DINO"</text>
    <text x="170" y="332" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="0.5px">MOTION DESIGNER &amp; GAMER</text>
  </g>

  <!-- CARIMBO POSTAL / STICKER "MG · BR" (DESLOCADO PARA O CANTO INFERIOR DIREITO, SEM TOCAR NO TEXTO) -->
  <g filter="url(#sticker-shadow)" transform="translate(230, 318) rotate(-10)">
    <rect x="0" y="0" width="76" height="32" rx="6" fill="#ff5436" stroke="#111111" stroke-width="3" />
    <!-- Borda serrilhada ou pontilhada de selo postal -->
    <rect x="3" y="3" width="70" height="26" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="38" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1px">MG &#183; BR</text>
  </g>
</svg>
