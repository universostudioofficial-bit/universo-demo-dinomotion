<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="100%" height="100%" fill="none">
  <!-- 3D Big Box PC Game: STREAMER HUD KIT -->
  <defs>
    <filter id="box-shadow-hud" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="14" stdDeviation="0" flood-color="#111111" flood-opacity="1" />
    </filter>
  </defs>

  <g filter="url(#box-shadow-hud)">
    <!-- Spine (Left side) -->
    <polygon points="45,80 100,50 100,310 45,340" fill="#6d28d9" stroke="#111111" stroke-width="5" stroke-linejoin="round" />
    <text x="-210" y="78" transform="rotate(-90)" font-family="'Gasoek One', Impact, sans-serif" font-size="20" fill="#ffffff" letter-spacing="3">STREAMER HUD KIT</text>

    <!-- Front Cover (Right side) -->
    <polygon points="100,50 285,75 285,335 100,310" fill="#8b5cf6" stroke="#111111" stroke-width="5" stroke-linejoin="round" />

    <!-- Top Flap -->
    <polygon points="45,80 100,50 285,75 230,105" fill="#a78bfa" stroke="#111111" stroke-width="5" stroke-linejoin="round" />

    <!-- Badge Hologram -->
    <circle cx="240" cy="120" r="26" fill="#06b6d4" stroke="#111111" stroke-width="4" />
    <text x="240" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#111111" text-anchor="middle">SOON</text>
    <text x="240" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#111111" text-anchor="middle">2026</text>

    <!-- Main Title Art on Box -->
    <rect x="115" y="150" width="155" height="48" rx="8" fill="#111111" />
    <text x="192" y="182" font-family="'Gasoek One', Impact, sans-serif" font-size="22" fill="#06b6d4" text-anchor="middle" letter-spacing="1">HUD KIT</text>

    <!-- Game HUD Overlay Graphic -->
    <rect x="125" y="215" width="135" height="50" rx="6" fill="#4c1d95" stroke="#111111" stroke-width="3" />
    <circle cx="145" cy="240" r="12" fill="#ef4444" stroke="#111111" stroke-width="2" />
    <rect x="165" y="230" width="80" height="8" rx="3" fill="#10b981" />
    <rect x="165" y="244" width="55" height="8" rx="3" fill="#3b82f6" />

    <!-- Subtitle Banner -->
    <rect x="120" y="280" width="145" height="24" rx="6" fill="#fef08a" stroke="#111111" stroke-width="3" />
    <text x="192" y="296" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#111111" text-anchor="middle">OVERLAYS &amp; ALERTS PRO</text>
  </g>
</svg>

