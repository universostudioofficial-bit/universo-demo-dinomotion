<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="100%" height="100%" fill="none">
  <!-- 3D Big Box PC Game: INDIE LAUNCH COMBO -->
  <defs>
    <filter id="box-shadow-combo" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="14" stdDeviation="0" flood-color="#111111" flood-opacity="1" />
    </filter>
  </defs>

  <g filter="url(#box-shadow-combo)">
    <!-- Spine (Left side) -->
    <polygon points="45,80 100,50 100,310 45,340" fill="#c2410c" stroke="#111111" stroke-width="5" stroke-linejoin="round" />
    <text x="-210" y="78" transform="rotate(-90)" font-family="'Gasoek One', Impact, sans-serif" font-size="20" fill="#ffffff" letter-spacing="3">INDIE LAUNCH COMBO</text>

    <!-- Front Cover (Right side) -->
    <polygon points="100,50 285,75 285,335 100,310" fill="#ff5436" stroke="#111111" stroke-width="5" stroke-linejoin="round" />

    <!-- Top Flap -->
    <polygon points="45,80 100,50 285,75 230,105" fill="#fb923c" stroke="#111111" stroke-width="5" stroke-linejoin="round" />

    <!-- Best Seller Wax Seal / Ribbon -->
    <path d="M 115 52 L 155 57 L 145 110 L 135 100 L 125 110 Z" fill="#facc15" stroke="#111111" stroke-width="3" />
    <circle cx="135" cy="85" r="16" fill="#111111" />
    <text x="135" y="89" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#facc15" text-anchor="middle">TOP</text>

    <!-- Main Title Art on Box -->
    <rect x="115" y="145" width="155" height="52" rx="8" fill="#fef08a" stroke="#111111" stroke-width="4" />
    <text x="192" y="180" font-family="'Gasoek One', Impact, sans-serif" font-size="24" fill="#111111" text-anchor="middle">LAUNCH</text>
    <text x="192" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#c2410c" text-anchor="middle" letter-spacing="2">COMBO PACK</text>

    <!-- Retro Tape Graphic (After Effects + SFX) -->
    <rect x="125" y="220" width="135" height="42" rx="6" fill="#1f2937" stroke="#111111" stroke-width="3" />
    <circle cx="150" cy="241" r="10" fill="#ffffff" stroke="#111111" stroke-width="3" />
    <circle cx="235" cy="241" r="10" fill="#ffffff" stroke="#111111" stroke-width="3" />
    <rect x="165" y="235" width="55" height="12" fill="#374151" />

    <!-- Subtitle Banner -->
    <rect x="120" y="275" width="145" height="24" rx="6" fill="#111111" />
    <text x="192" y="291" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">TEMPLATES AE + FULL SFX</text>
  </g>
</svg>
